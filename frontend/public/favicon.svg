<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40916c"/>
      <stop offset="100%" stop-color="#1b4332"/>
    </linearGradient>
    <linearGradient id="sproutGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#74c69d"/>
      <stop offset="100%" stop-color="#95d5b2"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eaf4ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#faf9f5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Subtle circular canvas backdrop -->
  <circle cx="32" cy="32" r="30" fill="#faf9f5" stroke="#e0ece4" stroke-width="2"/>
  <circle cx="32" cy="32" r="26" fill="url(#halo)"/>
  
  <!-- Stylized sanctuary double-leaf lotus / sprout -->
  <!-- Left petal / leaf -->
  <path d="M 32 46 C 20 44 14 32 18 20 C 24 25 28 35 32 46 Z" fill="url(#leafGrad)"/>
  <!-- Right petal / leaf -->
  <path d="M 32 46 C 44 44 50 32 46 20 C 40 25 36 35 32 46 Z" fill="url(#sproutGrad)"/>
  <!-- Center stem / calming aura -->
  <circle cx="32" cy="18" r="3" fill="#245741"/>
  <!-- Subtle heart / restoration curve at base -->
  <path d="M 30 46 C 31 48 33 48 34 46" stroke="#245741" stroke-width="2" stroke-linecap="round" fill="none"/>
</svg>
